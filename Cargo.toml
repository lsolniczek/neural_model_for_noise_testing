[package]
name = "neural_preset_optimizer"
version = "0.1.0"
edition = "2021"
description = "Neural model-based optimizer for noise generator presets"

[dependencies]
noise_generator_core = { git = "ssh://git@github.com/lsolniczek/noise_generator_dsp.git", rev = "81b51fad005bb6522cbbf42ef08ca4a3c6c9ab06", default-features = false }

rand = "0.8"
rand_distr = "0.4"
rand_chacha = "=0.3.1"
blake3 = "=1.8.2"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rustfft = "6"
chrono = "0.4"
